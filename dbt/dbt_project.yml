name: datatrust_warehouse
version: "1.0.0"
config-version: 2
profile: datatrust

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The synthetic snapshot is taken at the end of this day; "current" logic uses it instead of now().
  reference_date: "{{ env_var('DATATRUST_REFERENCE_DATE', '2026-09-30') }}"

models:
  datatrust_warehouse:
    staging:
      +schema: analytics_staging
      +materialized: view
      +contract:
        enforced: true
    intermediate:
      +schema: analytics_intermediate
      +materialized: table
    marts:
      +schema: analytics_marts
      +materialized: table

data_tests:
  datatrust_warehouse:
    # The raw feeds intentionally contain defects. dbt tests report them as warnings so the
    # build completes and DataTrust can ingest the outcomes alongside its own rule results.
    +severity: warn
