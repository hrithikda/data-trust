      per-payment comparison catches it.
    records:
      stg_shopfront__orders:
        - {order_id: SF4002, customer_id: C1001, order_status: delivered, sales_channel: web, currency: USD, subtotal_amount: 60.00, discount_amount: 0, shipping_amount: 0, tax_amount: 4.32, total_amount: 64.32, ordered_at: "2026-06-05 19:45:00"}
      stg_shopfront__order_items:
        - {order_item_id: SF4002-1, order_id: SF4002, product_id: P03, quantity: 1, unit_price: 28.00, line_amount: 28.00}
        - {order_item_id: SF4002-2, order_id: SF4002, product_id: P01, quantity: 2, unit_price: 16.00, line_amount: 32.00}
      stg_payrail__payments:
        - {payment_id: PAY4002A, order_id: SF4002, customer_id: C1001, payment_method: gift_card, payment_status: succeeded, amount: 25.00, currency: USD, processed_at: "2026-06-05 19:46:00"}
        - {payment_id: PAY4002B, order_id: SF4002, customer_id: C1001, payment_method: card, payment_status: succeeded, amount: 39.32, currency: USD, processed_at: "2026-06-05 19:46:05"}
      stg_payrail__refunds:
        - {refund_id: RF4002A, payment_id: PAY4002A, refund_amount: 15.00, refund_reason: damaged_in_transit, refunded_at: "2026-06-09 10:00:00"}
        - {refund_id: RF4002B, payment_id: PAY4002A, refund_amount: 12.00, refund_reason: quality_complaint, refunded_at: "2026-06-12 10:00:00"}

