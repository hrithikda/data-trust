# Regression suite for the three baseline errors on the held-out set (HO-036, HO-050, HO-059).
#
# Each baseline error is covered by variants that probe the edges of the fix, so the improved rules are
# shown to fix the error class rather than the single held-out example:
#   HO-050 (cumulative refunds missed)   -> RG-001, RG-002, RG-007, RG-010
#   HO-036 (payment customer mismatch)   -> RG-003, RG-009
#   HO-059 ($0 replacement false alarm)  -> RG-004, RG-005, RG-006, RG-008
# The baseline detector is expected to fail parts of this suite; the improved detector must pass all of it.

suite: regression
description: Variants of the baseline holdout errors that the improved detector must classify correctly.
reference_ts: "2026-06-30 23:59:59"

context:
  stg_shopfront__customers:
    - {customer_id: C1001, email: ava.kim@example.com, first_name: Ava, last_name: Kim, country_code: US, acquisition_channel: paid_search, customer_status: active, signed_up_at: "2025-01-10 09:00:00"}
    - {customer_id: C1002, email: noah.tremblay@example.com, first_name: Noah, last_name: Tremblay, country_code: CA, acquisition_channel: organic_search, customer_status: active, signed_up_at: "2025-03-05 14:20:00"}
    - {customer_id: C1004, email: leo.garcia@example.com, first_name: Leo, last_name: Garcia, country_code: US, acquisition_channel: email, customer_status: active, signed_up_at: "2025-08-20 18:45:00"}
  stg_shopfront__products:
    - {product_id: P01, sku: CL-HB-12, product_name: House Blend Whole Bean 12oz, category: whole_bean, list_price: 16.00, is_active: true, launched_on: "2023-06-01"}
    - {product_id: P02, sku: CL-ER-12, product_name: Ember Espresso Roast 12oz, category: espresso, list_price: 18.50, is_active: true, launched_on: "2023-06-01"}
    - {product_id: P03, sku: CL-EQ-V60, product_name: Ceramic Pour-Over Dripper, category: equipment, list_price: 28.00, is_active: true, launched_on: "2023-06-01"}

cases:
  - id: RG-001
    title: Three partial refunds that together exceed the payment
    expected: defective
    defect_category: financial_consistency
    description: Three 15.00 refunds against a 40.25 capture; each is individually smaller than the payment.
    records:
      stg_shopfront__orders:
        - {order_id: SF4001, customer_id: C1001, order_status: delivered, sales_channel: web, currency: USD, subtotal_amount: 32.00, discount_amount: 0, shipping_amount: 5.95, tax_amount: 2.30, total_amount: 40.25, ordered_at: "2026-06-06 11:00:00"}
      stg_shopfront__order_items:
        - {order_item_id: SF4001-1, order_id: SF4001, product_id: P01, quantity: 2, unit_price: 16.00, line_amount: 32.00}
      stg_payrail__payments:
        - {payment_id: PAY4001, order_id: SF4001, customer_id: C1001, payment_method: card, payment_status: succeeded, amount: 40.25, currency: USD, processed_at: "2026-06-06 11:01:00"}
      stg_payrail__refunds:
        - {refund_id: RF4001A, payment_id: PAY4001, refund_amount: 15.00, refund_reason: damaged_in_transit, refunded_at: "2026-06-09 10:00:00"}
        - {refund_id: RF4001B, payment_id: PAY4001, refund_amount: 15.00, refund_reason: quality_complaint, refunded_at: "2026-06-10 10:00:00"}
        - {refund_id: RF4001C, payment_id: PAY4001, refund_amount: 15.00, refund_reason: late_delivery, refunded_at: "2026-06-11 10:00:00"}

