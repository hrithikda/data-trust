    title: Customer mismatch on the second leg of a split tender
    expected: defective
    defect_category: business_rule
    description: The gift-card leg belongs to the order's customer; the card leg was recorded against another customer.
    records:
      stg_shopfront__orders:
        - {order_id: SF4003, customer_id: C1001, order_status: delivered, sales_channel: web, currency: USD, subtotal_amount: 60.00, discount_amount: 0, shipping_amount: 0, tax_amount: 4.32, total_amount: 64.32, ordered_at: "2026-06-07 19:45:00"}
      stg_shopfront__order_items:
        - {order_item_id: SF4003-1, order_id: SF4003, product_id: P03, quantity: 1, unit_price: 28.00, line_amount: 28.00}
        - {order_item_id: SF4003-2, order_id: SF4003, product_id: P01, quantity: 2, unit_price: 16.00, line_amount: 32.00}
      stg_payrail__payments:
        - {payment_id: PAY4003A, order_id: SF4003, customer_id: C1001, payment_method: gift_card, payment_status: succeeded, amount: 25.00, currency: USD, processed_at: "2026-06-07 19:46:00"}
        - {payment_id: PAY4003B, order_id: SF4003, customer_id: C1004, payment_method: card, payment_status: succeeded, amount: 39.32, currency: USD, processed_at: "2026-06-07 19:46:05"}

  - id: RG-004
    title: Spurious $0.00 capture on an order that costs money
    expected: defective
    defect_category: invalid_numeric
    description: >
      The full amount was captured, but a $0.00 succeeded capture was also recorded. The $0 relaxation applies only
      to zero-total orders, so this must still be flagged.
    records:
      stg_shopfront__orders:
        - {order_id: SF4004, customer_id: C1004, order_status: delivered, sales_channel: web, currency: USD, subtotal_amount: 16.00, discount_amount: 0, shipping_amount: 5.95, tax_amount: 1.15, total_amount: 23.10, ordered_at: "2026-06-04 08:30:00"}
      stg_shopfront__order_items:
        - {order_item_id: SF4004-1, order_id: SF4004, product_id: P01, quantity: 1, unit_price: 16.00, line_amount: 16.00}
      stg_payrail__payments:
        - {payment_id: PAY4004A, order_id: SF4004, customer_id: C1004, payment_method: card, payment_status: succeeded, amount: 23.10, currency: USD, processed_at: "2026-06-04 08:31:00"}
        - {payment_id: PAY4004B, order_id: SF4004, customer_id: C1004, payment_method: card, payment_status: succeeded, amount: 0.00, currency: USD, processed_at: "2026-06-04 08:31:02"}

  - id: RG-005
    title: $0.00 capture for an order that does not exist
    expected: defective
    defect_category: invalid_numeric
    description: A $0 capture can only be justified by a zero-total order; with no order it cannot be justified.
    records:
      stg_payrail__payments:
        - {payment_id: PAY4005, order_id: SF9998, customer_id: C1001, payment_method: card, payment_status: succeeded, amount: 0.00, currency: USD, processed_at: "2026-06-15 12:00:00"}

  - id: RG-006
