      stg_shopfront__order_items:
        - {order_item_id: SF4006-1, order_id: SF4006, product_id: P01, quantity: 1, unit_price: 16.00, line_amount: 16.00}
      stg_payrail__payments:
        - {payment_id: PAY4006, order_id: SF4006, customer_id: C1001, payment_method: card, payment_status: succeeded, amount: -5.00, currency: USD, processed_at: "2026-06-16 12:00:20"}

  - id: RG-007
    title: Three partial refunds that exactly equal the payment
    expected: valid
    description: Boundary case for the cumulative check; refunds sum to the capture to the cent.
    records:
      stg_shopfront__orders:
        - {order_id: SF4007, customer_id: C1004, order_status: returned, sales_channel: web, currency: USD, subtotal_amount: 16.00, discount_amount: 0, shipping_amount: 5.95, tax_amount: 1.15, total_amount: 23.10, ordered_at: "2026-06-02 10:00:00"}
