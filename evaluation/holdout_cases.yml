# Held-out evaluation set for the DataTrust quality detector.
#
# 60 labelled cases: 30 contain a genuine defect, 30 are valid (including legitimate edge cases).
# These cases were authored separately from the rule-development fixtures in tests/ and from
# the defects injected into the synthetic warehouse; the detector never sees the labels.
#
# A case is a handful of records across staging tables. The evaluator loads `context` (shared
# reference data: customers, products, a campaign) plus one case into an empty sandbox schema,
# runs every rule of the detector version, and predicts "defective" if any rule fails.
# Monetary convention: total = subtotal - discount + shipping + tax (US tax 7.2%, CA 5%, GB VAT-inclusive).

suite: holdout
description: Held-out cases used to measure detection performance of each detector version.
reference_ts: "2026-06-30 23:59:59"

context:
  stg_shopfront__customers:
    - {customer_id: C1001, email: ava.kim@example.com, first_name: Ava, last_name: Kim, country_code: US, acquisition_channel: paid_search, customer_status: active, signed_up_at: "2025-01-10 09:00:00"}
    - {customer_id: C1002, email: noah.tremblay@example.com, first_name: Noah, last_name: Tremblay, country_code: CA, acquisition_channel: organic_search, customer_status: active, signed_up_at: "2025-03-05 14:20:00"}
